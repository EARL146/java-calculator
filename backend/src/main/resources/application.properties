# ============================================================
#  Hito Backend - Application Configuration
#  This file is read by Spring Boot at startup.
#  Do NOT hardcode credentials in Java classes — put them here.
# ============================================================

# --- Server ---
server.port=8080

# --- MySQL Database ---
# Make sure XAMPP MySQL is running before starting the backend.
# Change "hito_db" to whatever database name you created in phpMyAdmin.
spring.datasource.url=jdbc:mysql://localhost:3306/hito_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# "update" means Hibernate will automatically create or update tables
# based on your Entity classes. Great during development.
# Change to "validate" or "none" in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- Application Name ---
spring.application.name=hito-backend
